<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>RP2040 FuncGen</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --card2: #1c222b; --line: #2d3540;
    --text: #e6edf3; --dim: #8b96a3; --accent: #58a6ff;
    --ch1: #f2cc60; --ch2: #56c8f5; --ok: #3fb950; --err: #f85149;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, "Yu Gothic UI", "Noto Sans JP", sans-serif; }
  body { padding-bottom: env(safe-area-inset-bottom); }
  button, input, select { font: inherit; color: inherit; }

  /* ---------- header ---------- */
  header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top));
    background: rgba(13,17,23,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: .02em; }
  header h1 small { color: var(--dim); font-weight: 400; margin-left: 4px; }
  .spacer { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px;
    background: var(--card2); color: var(--dim); font-size: 12px; white-space: nowrap; }
  .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .pill.on { color: var(--ok); } .pill.on::before { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .btn { border: 1px solid var(--line); background: var(--card2); border-radius: 8px; padding: 7px 14px;
    cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #0d1117; font-weight: 700; }

  /* ---------- layout ---------- */
  .layout { display: grid; gap: 12px; padding: 12px 16px; max-width: 1400px; margin: 0 auto;
    grid-template-columns: minmax(340px, 420px) 1fr; grid-template-areas: "ctrl scope"; }
  .controls { grid-area: ctrl; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .scope { grid-area: scope; position: sticky; top: 64px; align-self: start;
    height: calc(100vh - 88px); display: flex; flex-direction: column; min-width: 0; }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; grid-template-areas: "scope" "ctrl"; padding: 8px 10px; gap: 10px; }
    .scope { top: 52px; height: 46vh; min-height: 300px; z-index: 5; }
    header { padding: 8px 10px; }
  }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
  .card h2 { margin: 0 0 10px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .card h2 .tag { font-size: 11px; font-weight: 400; color: var(--dim); }
  .card h2 .dot { width: 10px; height: 10px; border-radius: 3px; }

  /* ---------- scope ---------- */
  .scope.card { padding: 8px; }
  #scope { flex: 1; width: 100%; min-height: 0; border-radius: 8px; background: #0d1117; display: block; }
  .scope-opts { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 8px 4px 2px; font-size: 12px; color: var(--dim); }
  .scope-opts input[type=number] { width: 72px; }
  @media (max-width: 860px) { .scope-opts { display: none; } }

  /* ---------- controls ---------- */
  .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .row label.name { width: 84px; color: var(--dim); flex: none; }
  input[type=number], select { background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 8px; min-width: 0; }
  input[type=number] { width: 110px; text-align: right; }
  input[type=number]:focus, select:focus { outline: none; border-color: var(--accent); }
  input[type=range] { width: 100%; margin: 8px 0 2px; accent-color: var(--accent); height: 28px; }
  .ch1 input[type=range] { accent-color: var(--ch1); }
  .ch2 input[type=range] { accent-color: var(--ch2); }
  .unit { color: var(--dim); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 2px; }
  .chip { border: 1px solid var(--line); background: var(--card2); border-radius: 99px; padding: 3px 10px;
    font-size: 12px; cursor: pointer; }
  .chip:hover { border-color: var(--accent); }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: transparent; border-radius: 7px; padding: 6px 0; cursor: pointer; color: var(--dim); }
  .seg button.sel { background: var(--card2); color: var(--text); box-shadow: inset 0 0 0 1px var(--ch2); }

  .out { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
  .switch { position: relative; width: 52px; height: 30px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: var(--card2); border: 1px solid var(--line);
    border-radius: 99px; transition: .15s; cursor: pointer; }
  .switch span::before { content: ""; position: absolute; width: 22px; height: 22px; left: 3px; top: 3px;
    border-radius: 50%; background: var(--dim); transition: .15s; }
  .switch input:checked + span { background: var(--ok); border-color: var(--ok); }
  .switch input:checked + span::before { transform: translateX(22px); background: #fff; }
  .switch input:disabled + span { opacity: .4; cursor: not-allowed; }
  .info { font-size: 12px; color: var(--dim); font-family: ui-monospace, Consolas, monospace; overflow-wrap: anywhere; }
  .info.active { color: var(--text); }
  .note { font-size: 11px; color: var(--dim); margin: 8px 0 0; }

  details.card summary { cursor: pointer; color: var(--dim); }
  #log { margin-top: 8px; height: 160px; overflow: auto; font: 11px/1.45 ui-monospace, Consolas, monospace;
    background: var(--bg); border-radius: 8px; padding: 6px 8px; white-space: pre-wrap; }
  #log .tx { color: var(--accent); } #log .rx { color: var(--text); } #log .er { color: var(--err); }
  .settings { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-top: 10px; font-size: 12px; color: var(--dim); }
  .mobile-sim { display: none; }
  @media (max-width: 860px) { .mobile-sim { display: block; } }

  #toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--card2); border: 1px solid var(--line); padding: 10px 16px; border-radius: 10px;
    max-width: calc(100% - 32px); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50; }
  #toast.show { opacity: 1; } #toast.err { border-color: var(--err); }
</style>
</head>
<body>
<header>
  <h1>FuncGen<small>RP2040</small></h1>
  <span class="spacer"></span>
  <span id="status" class="pill">未接続</span>
  <button id="connect" class="btn primary">接続</button>
</header>

<main class="layout">
  <!-- ===== simulation ===== -->
  <section class="scope card">
    <canvas id="scope"></canvas>
    <div class="scope-opts sim-opts"></div>
  </section>

  <section class="controls">
    <!-- ===== CH1 ===== -->
    <div class="card ch1">
      <h2><span class="dot" style="background:var(--ch1)"></span>CH1 PWM <span class="tag">GPIO0 出力 / GPIO1 反転</span></h2>
      <div class="freq" data-ch="pwm"></div>
      <div class="pct" data-ch="pwm" data-key="duty" data-label="デューティー" data-step="0.1"
           data-chips="10,25,50,75,90"></div>
      <div class="out">
        <label class="switch"><input type="checkbox" id="pwm-on" disabled><span></span></label>
        <div id="pwm-info" class="info">未接続</div>
      </div>
    </div>

    <!-- ===== CH2 ===== -->
    <div class="card ch2">
      <h2><span class="dot" style="background:var(--ch2)"></span>CH2 波形 <span class="tag">試験的 · GPIO2 + / GPIO3 − 差動</span></h2>
      <div class="seg" id="wave-type">
        <button data-v="SINE">正弦</button><button data-v="TRI">三角</button>
        <button data-v="SAW">のこぎり</button><button data-v="SQR">矩形</button>
      </div>
      <div class="freq" data-ch="wave"></div>
      <div class="pct" data-ch="wave" data-key="amp" data-label="振幅 p-p" data-step="1" data-chips="25,50,100"></div>
      <div class="pct" data-ch="wave" data-key="ofs" data-label="オフセット" data-step="1" data-chips="25,50,75"></div>
      <div class="out">
        <label class="switch"><input type="checkbox" id="wave-on" disabled><span></span></label>
        <div id="wave-info" class="info">未接続</div>
      </div>
      <p class="note">※ 各ピンに RC ローパス (例 1kΩ + 10nF, fc≈16kHz) を付けて (+) − (−) を測定。キャリア約390kHz / 9bit。</p>
    </div>

    <!-- ===== settings / log ===== -->
    <details class="card mobile-sim">
      <summary>シミュレーション設定</summary>
      <div class="settings sim-opts"></div>
    </details>
    <details class="card">
      <summary>ログ・接続設定</summary>
      <div class="settings">
        <label>接続方式
          <select id="method">
            <option value="auto">自動</option>
            <option value="serial">Web Serial (PC)</option>
            <option value="usb">WebUSB (Android)</option>
          </select>
        </label>
        <span id="support"></span>
      </div>
      <div id="log"></div>
    </details>
  </section>
</main>
<div id="toast"></div>

<template id="tpl-freq">
  <div class="row"><label class="name">周波数</label>
    <input type="number" class="num" inputmode="decimal" step="any" min="0">
    <select class="unit-sel"><option>Hz</option><option>kHz</option><option>MHz</option></select>
  </div>
  <input type="range" class="range" min="0" max="1000" step="1">
  <div class="chips"></div>
</template>
<template id="tpl-pct">
  <div class="row"><label class="name"></label>
    <input type="number" class="num" inputmode="decimal" min="0" max="100">
    <span class="unit">%</span>
  </div>
  <input type="range" class="range" min="0" max="100">
  <div class="chips"></div>
</template>
<template id="tpl-sim">
  <label><input type="radio" name="simmode" value="rc"> RCフィルタ後</label>
  <label><input type="radio" name="simmode" value="ideal"> 理想 (PWM平均)</label>
  <label>R <input type="number" class="sim-r" min="0" step="any"> Ω</label>
  <label>C <input type="number" class="sim-c" min="0" step="any"> nF</label>
  <label><input type="checkbox" data-show="b"> CH1 反転</label>
  <label><input type="checkbox" data-show="p"> CH2 +</label>
  <label><input type="checkbox" data-show="n"> CH2 −</label>
  <label><input type="checkbox" data-show="diff"> 差動</label>
</template>

<script type="module" src="js/app.js"></script>
</body>
</html>
